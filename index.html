<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>tuandv.id.vn</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-hover: #1e222b;
    --border: #262b35;
    --text: #e8eaed;
    --text-dim: #8b93a1;
    --accent: #5eb594;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 16px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 820px;
  }
  a.card, div.card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 20px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .icon { font-size: 26px; }
  .name { font-size: 16px; font-weight: 600; }
  .desc { font-size: 13px; color: var(--text-dim); }
  .card.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(94, 181, 148, 0.15);
    color: var(--accent);
    width: fit-content;
  }
  .card.disabled .badge {
    background: rgba(139, 147, 161, 0.15);
    color: var(--text-dim);
  }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* --- Auth --- */
  #authBar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
  }
  .btn-login {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-login:hover {
    background: var(--card-hover);
    border-color: var(--accent);
  }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px 6px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
  }
  .user-chip:hover { border-color: var(--accent); }
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--accent);
    color: #0f1115;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
  }
  .user-menu {
    position: absolute;
    top: 44px;
    right: 0;
    display: none;
    flex-direction: column;
    min-width: 160px;
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .user-menu.open { display: flex; }
  .user-menu button {
    all: unset;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .user-menu button:hover { background: var(--card-hover); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .auth-modal {
    width: 100%;
    max-width: 340px;
    padding: 24px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .auth-modal h2 {
    margin: 0 0 4px;
    font-size: 18px;
  }
  .auth-modal .sub {
    margin: 0 0 18px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .auth-modal input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .auth-modal input:focus { border-color: var(--accent); }
  .auth-modal .error {
    color: #e0685f;
    font-size: 12px;
    margin: 0 0 8px;
  }
  .btn-primary {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0f1115;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0;
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  #googleBtnContainer {
    margin-bottom: 8px;
  }
  .btn-social,
  .btn-social-fb {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-social:hover,
  .btn-social-fb:hover { border-color: var(--accent); }
  .close-x {
    all: unset;
    position: absolute;
    top: 14px;
    right: 16px;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-dim);
  }
  .auth-modal { position: relative; }
</style>
</head>
<body>
  <div id="authBar"></div>

  <header>
    <h1>tuandv.id.vn</h1>
    <p>Các dự án đang chạy</p>
  </header>

  <div class="grid">
    <a class="card" href="https://connectdoctor.tuandv.id.vn" target="_blank" rel="noreferrer">
      <span class="icon">🩺</span>
      <span class="name">ConnectDoctor</span>
      <span class="desc">Telemedicine — kết nối bệnh nhân & bác sĩ</span>
    </a>

    <!-- Hidden 2026-08-01 at owner's request — kept in source, not deleted.
         Un-comment to bring back. -->
    <!--
    <a class="card" href="/kinhdich/">
      <span class="icon">☯️</span>
      <span class="name">Kinh Dịch</span>
      <span class="desc">Học Kinh Dịch, gieo quẻ, giải mộng</span>
    </a>

    <a class="card" href="/xsmb/">
      <span class="icon">🎲</span>
      <span class="name">XSMB</span>
      <span class="desc">Thống kê & tư vấn xổ số miền Bắc</span>
    </a>
    -->

    <a class="card" href="/meeting/">
      <span class="icon">🎙️</span>
      <span class="name">AI Meeting Assistant</span>
      <span class="desc">Trợ lý ghi chú & tóm tắt cuộc họp</span>
    </a>

    <a class="card" href="https://ksbvapi.tuandv.id.vn/ai-director/" target="_blank" rel="noreferrer">
      <span class="icon">🏥</span>
      <span class="name">AI Director</span>
      <span class="desc">Hỏi đáp báo cáo tuần bệnh viện (thử nghiệm)</span>
    </a>

    <!-- Hidden 2026-08-01 at owner's request — kept in source, not deleted.
         Un-comment to bring back. -->
    <!--
    <a class="card" href="/jobs/">
      <span class="icon">💼</span>
      <span class="name">AI Job Search</span>
      <span class="desc">Dashboard theo dõi job scrape hàng ngày (cần đăng nhập)</span>
    </a>
    -->
  </div>

  <footer>© <span id="year"></span> tuandv.id.vn</footer>

  <!-- Login modal — real Firebase Auth (email/password + Google + Facebook), shared
       identity across the whole tuandv.id.vn ecosystem. See
       .claude/plans/virtual-sparking-beaver.md. -->
  <div class="modal-overlay" id="authOverlay">
    <div class="auth-modal">
      <button class="close-x" id="authCloseBtn">×</button>
      <h2>Đăng nhập</h2>
      <p class="sub">Dùng chung cho cả hệ sinh thái tuandv.id.vn.</p>

      <button type="button" class="btn-social" id="googleLoginBtn">Tiếp tục với Google</button>
      <button type="button" class="btn-social-fb" id="fbLoginBtn">📘 Tiếp tục với Facebook</button>

      <div class="divider">hoặc</div>

      <form id="basicLoginForm">
        <input id="basicUsername" type="email" placeholder="Email" autocomplete="username" />
        <input id="basicPassword" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
        <p class="error" id="basicError" style="display:none"></p>
        <button type="submit" class="btn-primary">Đăng nhập / Đăng ký</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence,
      GoogleAuthProvider, FacebookAuthProvider, signInWithPopup,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

    document.getElementById('year').textContent = new Date().getFullYear();

    // Same Firebase project ConnectDoctor already uses — shared identity for the whole
    // tuandv.id.vn ecosystem. Public web config, safe to embed client-side (restricted by
    // Firebase Authorized domains, not by keeping this value secret).
    // See .claude/plans/virtual-sparking-beaver.md.
    const firebaseConfig = {
      apiKey: 'AIzaSyD3xDlMt7aYdYsutNLYoMcm63LoLt_1Oxo',
      authDomain: 'connectdoctor-8d202.firebaseapp.com',
      projectId: 'connectdoctor-8d202',
      storageBucket: 'connectdoctor-8d202.firebasestorage.app',
      messagingSenderId: '1063151091025',
      appId: '1:1063151091025:web:9f7613a32dcfe2d54fa770',
    };
    const auth = getAuth(initializeApp(firebaseConfig));
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const IDENTITY_COOKIE = 'tdv_identity';
    const COOKIE_DOMAIN = '.tuandv.id.vn';

    // Shared across all *.tuandv.id.vn subdomains — display-name/avatar only, read by
    // ecosystem-badge.js on the sites not yet migrated to real Firebase SSO (xsmb,
    // meeting, jobs). Not a session/auth token itself — the real session lives in
    // Firebase's own persistence (same-origin, shared automatically with /kinhdich).
    function setIdentityCookie(user) {
      const value = encodeURIComponent(JSON.stringify({ name: user.name, avatar: user.avatar || null }));
      document.cookie =
        `${IDENTITY_COOKIE}=${value}; domain=${COOKIE_DOMAIN}; path=/; max-age=2592000; secure; samesite=lax`;
    }
    function clearIdentityCookie() {
      document.cookie = `${IDENTITY_COOKIE}=; domain=${COOKIE_DOMAIN}; path=/; max-age=0; secure; samesite=lax`;
    }

    function mapFirebaseError(err) {
      const code = err && err.code;
      if (code === 'auth/invalid-email') return 'Email không hợp lệ';
      if (code === 'auth/weak-password') return 'Mật khẩu tối thiểu 6 ký tự';
      if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Sai email hoặc mật khẩu';
      if (code === 'auth/email-already-in-use') return 'Email đã được dùng với mật khẩu khác';
      return (err && err.message) || 'Đăng nhập thất bại';
    }

    function showError(err) {
      if (err && err.code === 'auth/popup-closed-by-user') return;
      const errorEl = document.getElementById('basicError');
      errorEl.textContent = mapFirebaseError(err);
      errorEl.style.display = 'block';
    }

    function renderAuthBar(fbUser) {
      const bar = document.getElementById('authBar');

      if (!fbUser) {
        bar.innerHTML = '<button class="btn-login" id="openLoginBtn">Đăng nhập</button>';
        document.getElementById('openLoginBtn').addEventListener('click', openAuthModal);
        return;
      }

      const name = fbUser.displayName || fbUser.email;
      bar.innerHTML =
        '<div style="position:relative">' +
        '<div class="user-chip" id="userChipBtn"></div>' +
        '<div class="user-menu" id="userMenu"><button id="logoutBtn">Đăng xuất</button></div>' +
        '</div>';

      const chip = document.getElementById('userChipBtn');
      if (fbUser.photoURL) {
        const img = document.createElement('img');
        img.className = 'avatar';
        img.src = fbUser.photoURL;
        img.alt = '';
        chip.appendChild(img);
      } else {
        const initial = document.createElement('span');
        initial.className = 'avatar';
        initial.textContent = (name || '?').trim().charAt(0).toUpperCase();
        chip.appendChild(initial);
      }
      const nameEl = document.createElement('span');
      nameEl.textContent = name;
      chip.appendChild(nameEl);

      chip.addEventListener('click', () => {
        document.getElementById('userMenu').classList.toggle('open');
      });
      document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
    }

    function openAuthModal() {
      document.getElementById('authOverlay').classList.add('open');
    }
    function closeAuthModal() {
      document.getElementById('authOverlay').classList.remove('open');
      document.getElementById('basicError').style.display = 'none';
    }

    document.getElementById('authCloseBtn').addEventListener('click', closeAuthModal);
    document.getElementById('authOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeAuthModal();
    });

    document.getElementById('basicLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('basicUsername').value.trim();
      const password = document.getElementById('basicPassword').value;
      const errorEl = document.getElementById('basicError');
      errorEl.style.display = 'none';
      if (!email || !password) {
        errorEl.textContent = 'Nhập email và mật khẩu';
        errorEl.style.display = 'block';
        return;
      }
      try {
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            throw err;
          }
        }
        closeAuthModal();
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', () => {
      signInWithPopup(auth, new GoogleAuthProvider()).then(closeAuthModal).catch(showError);
    });
    document.getElementById('fbLoginBtn').addEventListener('click', () => {
      signInWithPopup(auth, new FacebookAuthProvider()).then(closeAuthModal).catch(showError);
    });

    onAuthStateChanged(auth, (fbUser) => {
      if (fbUser) setIdentityCookie({ name: fbUser.displayName || fbUser.email, avatar: fbUser.photoURL });
      else clearIdentityCookie();
      renderAuthBar(fbUser);
    });
  </script>
</body>
</html>
